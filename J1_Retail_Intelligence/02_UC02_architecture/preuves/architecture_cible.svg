<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 560" width="1250" height="560" font-family="Arial, Helvetica, sans-serif"><rect width="100%" height="100%" fill="white"/><defs><marker id="fl" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#444"/></marker></defs><text x="20" y="28" font-size="17" text-anchor="start" font-weight="bold">Architecture logique cible : Retail Intelligence Platform (batch)</text><text x="105.0" y="58" font-size="13" text-anchor="middle" font-weight="bold">SOURCES</text><text x="300.0" y="58" font-size="13" text-anchor="middle" font-weight="bold">INGESTION</text><text x="495.0" y="58" font-size="13" text-anchor="middle" font-weight="bold">BRONZE</text><text x="710.0" y="58" font-size="13" text-anchor="middle" font-weight="bold">SILVER</text><text x="925.0" y="58" font-size="13" text-anchor="middle" font-weight="bold">GOLD</text><text x="1137.5" y="58" font-size="13" text-anchor="middle" font-weight="bold">EXPOSITION</text><rect x="20" y="70" width="170" height="110" rx="6" fill="#d9f2d9" stroke="#2e7d32" stroke-width="1.5"/><text x="105.0" y="100.66666666666667" text-anchor="middle" font-size="11" font-weight="bold">TPCx-BB (.dat)</text><text x="105.0" y="114.66666666666667" text-anchor="middle" font-size="11">7 tables observées :</text><text x="105.0" y="128.66666666666669" text-anchor="middle" font-size="11">customer*, date_dim,</text><text x="105.0" y="142.66666666666669" text-anchor="middle" font-size="11">household_dem., income_band,</text><text x="105.0" y="156.66666666666669" text-anchor="middle" font-size="11">inventory</text><rect x="20" y="190" width="170" height="80" rx="6" fill="#eeeeee" stroke="#777777" stroke-width="1.5" stroke-dasharray="6,4"/><text x="105.0" y="219.66666666666666" text-anchor="middle" font-size="11">TPCx-BB attendu</text><text x="105.0" y="233.66666666666666" text-anchor="middle" font-size="11">(ventes, retours, item,</text><text x="105.0" y="247.66666666666666" text-anchor="middle" font-size="11">store... absents du zip)</text><rect x="20" y="280" width="170" height="70" rx="6" fill="#eeeeee" stroke="#777777" stroke-width="1.5" stroke-dasharray="6,4"/><text x="105.0" y="304.6666666666667" text-anchor="middle" font-size="11">Compléments éventuels</text><text x="105.0" y="318.6666666666667" text-anchor="middle" font-size="11">(JSON, logs) : synthétiques,</text><text x="105.0" y="332.6666666666667" text-anchor="middle" font-size="11">toujours séparés</text><rect x="225" y="70" width="150" height="280" rx="6" fill="#dce8fb" stroke="#1f4e9c" stroke-width="1.5"/><text x="300.0" y="150.66666666666666" text-anchor="middle" font-size="11" font-weight="bold">Apache NiFi</text><text x="300.0" y="164.66666666666666" text-anchor="middle" font-size="11"></text><text x="300.0" y="178.66666666666666" text-anchor="middle" font-size="11">dépôt des fichiers</text><text x="300.0" y="192.66666666666666" text-anchor="middle" font-size="11">contrôle de présence</text><text x="300.0" y="206.66666666666666" text-anchor="middle" font-size="11">ajout de la provenance</text><text x="300.0" y="220.66666666666666" text-anchor="middle" font-size="11">(source, date, taille,</text><text x="300.0" y="234.66666666666666" text-anchor="middle" font-size="11">somme de contrôle)</text><text x="300.0" y="248.66666666666666" text-anchor="middle" font-size="11"></text><text x="300.0" y="262.66666666666663" text-anchor="middle" font-size="11">Repli documenté :</text><text x="300.0" y="276.66666666666663" text-anchor="middle" font-size="11">scripts Python + HDFS</text><rect x="410" y="70" width="170" height="280" rx="6" fill="#f3dfc6" stroke="#8a5a1e" stroke-width="1.5"/><text x="495.0" y="143.66666666666666" text-anchor="middle" font-size="11" font-weight="bold">Stockage brut (HDFS)</text><text x="495.0" y="157.66666666666666" text-anchor="middle" font-size="11"></text><text x="495.0" y="171.66666666666666" text-anchor="middle" font-size="11">/datalake/bronze/</text><text x="495.0" y="185.66666666666666" text-anchor="middle" font-size="11">  tpcxbb/&lt;table&gt;/</text><text x="495.0" y="199.66666666666666" text-anchor="middle" font-size="11">  ingest_date=AAAA-MM-JJ/</text><text x="495.0" y="213.66666666666666" text-anchor="middle" font-size="11"></text><text x="495.0" y="227.66666666666666" text-anchor="middle" font-size="11">fichiers .dat tels que reçus</text><text x="495.0" y="241.66666666666666" text-anchor="middle" font-size="11">(sans modification)</text><text x="495.0" y="255.66666666666666" text-anchor="middle" font-size="11"></text><text x="495.0" y="269.66666666666663" text-anchor="middle" font-size="11">+ manifeste de provenance</text><text x="495.0" y="283.66666666666663" text-anchor="middle" font-size="11">Lecture seule</text><rect x="615" y="70" width="190" height="280" rx="6" fill="#e6e9ee" stroke="#5b6573" stroke-width="1.5"/><text x="710.0" y="136.66666666666666" text-anchor="middle" font-size="11" font-weight="bold">Préparation et contrôle</text><text x="710.0" y="150.66666666666666" text-anchor="middle" font-size="11">(Spark / PySpark)</text><text x="710.0" y="164.66666666666666" text-anchor="middle" font-size="11"></text><text x="710.0" y="178.66666666666666" text-anchor="middle" font-size="11">typage selon le DDL de la spec</text><text x="710.0" y="192.66666666666666" text-anchor="middle" font-size="11">noms de colonnes ajoutés</text><text x="710.0" y="206.66666666666666" text-anchor="middle" font-size="11">vides -&gt; NULL</text><text x="710.0" y="220.66666666666666" text-anchor="middle" font-size="11">contrôle de clés et jointures</text><text x="710.0" y="234.66666666666666" text-anchor="middle" font-size="11">doublons, valeurs négatives</text><text x="710.0" y="248.66666666666666" text-anchor="middle" font-size="11">rejets -&gt; /silver/_rejets</text><text x="710.0" y="262.66666666666663" text-anchor="middle" font-size="11"></text><text x="710.0" y="276.66666666666663" text-anchor="middle" font-size="11">Parquet typé</text><text x="710.0" y="290.66666666666663" text-anchor="middle" font-size="11">/datalake/silver/&lt;table&gt;/</text><rect x="840" y="70" width="170" height="280" rx="6" fill="#fff3b8" stroke="#a07d00" stroke-width="1.5"/><text x="925.0" y="150.66666666666666" text-anchor="middle" font-size="11" font-weight="bold">Données analytiques</text><text x="925.0" y="164.66666666666666" text-anchor="middle" font-size="11"></text><text x="925.0" y="178.66666666666666" text-anchor="middle" font-size="11">Parquet partitionné</text><text x="925.0" y="192.66666666666666" text-anchor="middle" font-size="11">/datalake/gold/</text><text x="925.0" y="206.66666666666666" text-anchor="middle" font-size="11"></text><text x="925.0" y="220.66666666666666" text-anchor="middle" font-size="11">faits et dimensions</text><text x="925.0" y="234.66666666666666" text-anchor="middle" font-size="11">(étoile, grain défini)</text><text x="925.0" y="248.66666666666666" text-anchor="middle" font-size="11">agrégats de KPI</text><text x="925.0" y="262.66666666666663" text-anchor="middle" font-size="11">par période / magasin /</text><text x="925.0" y="276.66666666666663" text-anchor="middle" font-size="11">produit / canal</text><rect x="1045" y="70" width="185" height="130" rx="6" fill="#dce8fb" stroke="#1f4e9c" stroke-width="1.5"/><text x="1137.5" y="117.66666666666667" text-anchor="middle" font-size="11" font-weight="bold">Exposition des KPI</text><text x="1137.5" y="131.66666666666669" text-anchor="middle" font-size="11"></text><text x="1137.5" y="145.66666666666669" text-anchor="middle" font-size="11">requêtes SQL / Spark</text><text x="1137.5" y="159.66666666666669" text-anchor="middle" font-size="11">tableaux de bord BI</text><rect x="1045" y="210" width="185" height="140" rx="6" fill="#dce8fb" stroke="#1f4e9c" stroke-width="1.5"/><text x="1137.5" y="255.66666666666666" text-anchor="middle" font-size="11">Consommateurs</text><text x="1137.5" y="269.66666666666663" text-anchor="middle" font-size="11"></text><text x="1137.5" y="283.66666666666663" text-anchor="middle" font-size="11">Direction, commercial,</text><text x="1137.5" y="297.66666666666663" text-anchor="middle" font-size="11">contrôle de gestion,</text><text x="1137.5" y="311.66666666666663" text-anchor="middle" font-size="11">stocks, équipe Data</text><line x1="190" y1="210" x2="225" y2="210" stroke="#444" stroke-width="1.5" marker-end="url(#fl)"/><line x1="375" y1="210" x2="410" y2="210" stroke="#444" stroke-width="1.5" marker-end="url(#fl)"/><line x1="580" y1="210" x2="615" y2="210" stroke="#444" stroke-width="1.5" marker-end="url(#fl)"/><line x1="805" y1="210" x2="840" y2="210" stroke="#444" stroke-width="1.5" marker-end="url(#fl)"/><line x1="1010" y1="210" x2="1045" y2="210" stroke="#444" stroke-width="1.5" marker-end="url(#fl)"/><rect x="20" y="380" width="1210" height="70" rx="6" fill="#fde2e2" stroke="#a33" stroke-width="1.5"/><text x="625.0" y="419.0" text-anchor="middle" font-size="12">GOUVERNANCE : catalogue et dictionnaire de données | traçabilité (provenance, lineage) | rôles et droits d'accès par zone | masquage des données personnelles (nom, email, login) | règles de qualité</text><rect x="20" y="465" width="1210" height="55" rx="6" fill="#fde2e2" stroke="#a33" stroke-width="1.5"/><text x="625.0" y="496.5" text-anchor="middle" font-size="12">SUPERVISION : journaux de chaque traitement | compteurs de lignes entrée/sortie | alertes sur rejets | suivi des volumes et des coûts</text><text x="20" y="545" font-size="11" text-anchor="start">Vert = observé dans le zip reçu ; gris pointillé = attendu mais non fourni ou facultatif (traité séparément).</text></svg>