# Environnement J2 : HDFS mono-noeud (NameNode + 1 DataNode) et NiFi, versions de la matrice du TP
services:
  namenode:
    image: apache/hadoop:3.5.0
    hostname: namenode
    container_name: j2-namenode
    command: ["hdfs", "namenode"]
    ports: ["9870:9870"]
    env_file: ./hadoop.env
    environment:
      ENSURE_NAMENODE_DIR: /tmp/hadoop-hadoop/dfs/name
  datanode:
    image: apache/hadoop:3.5.0
    hostname: datanode
    container_name: j2-datanode
    command: ["hdfs", "datanode"]
    env_file: ./hadoop.env
    depends_on: [namenode]
  nifi:
    image: apache/nifi:2.12.0
    hostname: nifi
    container_name: j2-nifi
    ports: ["8443:8443"]
    env_file: ./nifi.env
    environment:
      NIFI_WEB_HTTPS_PORT: 8443
      HADOOP_USER_NAME: hadoop
    volumes:
      - ./nifi-hadoop-conf:/opt/hadoop-conf:ro
    depends_on: [namenode, datanode]
